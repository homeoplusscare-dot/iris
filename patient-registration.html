<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOMEOPLUSS • Registration</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#163c56;background:linear-gradient(135deg,#f5fdfe,#eaf7fb)}
.page{height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.box{width:min(980px,100%);max-height:96vh;overflow:auto;background:#fff;border:1px solid #d5ebf0;border-radius:30px;padding:28px;box-shadow:0 25px 70px rgba(2,93,163,.14)}
.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e3f0f3;padding-bottom:16px}.brand{font-size:25px;font-weight:900;color:#025da3}.tag{font-size:11px;color:#71899a;margin-top:3px}.back{padding:11px 15px;border:0;border-radius:12px;background:#eaf6f8;color:#025da3;font-weight:900}
h1{font-size:27px;margin:20px 0 5px}.sub{color:#708797;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.field label{display:block;font-size:11px;font-weight:900;color:#507086;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;height:48px;border:1px solid #cfe5eb;border-radius:12px;padding:10px;outline:none;background:#fbfeff;font-weight:700}.field textarea{height:78px;resize:none}.full{grid-column:1/-1}.actions{display:flex;gap:12px;margin-top:20px}.actions button{flex:1;height:52px;border:0;border-radius:14px;font-weight:900}.save{color:#fff;background:linear-gradient(135deg,#025da3,#00a8b3);box-shadow:0 10px 22px rgba(2,93,163,.2)}.clear{background:#edf3f5;color:#456}
.modal{position:fixed;inset:0;background:rgba(4,40,60,.35);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.popup{width:min(500px,100%);background:#fff;border-radius:25px;padding:30px;text-align:center;box-shadow:0 30px 80px #0003}.tick{font-size:55px;color:#08a878}.popup h2{color:#025da3}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.box{padding:20px}.page{padding:8px}}
</style>
</head>
<body>
<div class="page"><div class="box">
<div class="head"><div><div class="brand">HOMEOPLUSS Homeopathy</div><div class="tag">Homeopathy – Caring Naturally Since 1796</div></div><button class="back" onclick="location.href='index.html'">← LOGIN</button></div>
<h1>New Patient Registration</h1><div class="sub">Create your permanent HOMEOPLUSS registration.</div>
<div class="grid">
<div class="field"><label>FULL NAME</label><input id="name" placeholder="Patient full name"></div>
<div class="field"><label>GENDER</label><select id="gender"><option value="">Select Gender</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="field"><label>DATE OF BIRTH</label><input id="dob" type="date" onchange="calcAge()"></div>
<div class="field"><label>AGE</label><input id="age" readonly></div>
<div class="field"><label>MOBILE NUMBER</label><input id="mobile" maxlength="10" inputmode="numeric" placeholder="10 digit mobile"></div>
<div class="field"><label>SOURCE</label><select id="source"><option>Online</option><option>Walk-in</option><option>Reference</option></select></div>
<div class="field full"><label>ADDRESS</label><textarea id="address" placeholder="Patient address"></textarea></div>
<div class="field"><label>REFERRAL ID</label><input id="referralId" placeholder="Example: HP-9876543210-1990"></div>
<div class="field"><label>PERMANENT REGISTRATION NO.</label><input id="regNo" readonly placeholder="Generated automatically"></div>
</div>
<div class="actions"><button class="clear" onclick="location.href='index.html'">CANCEL</button><button class="save" onclick="registerPatient()">CREATE PATIENT</button></div>
</div></div>

<div id="modal" class="modal"><div class="popup"><div class="tick">✓</div><h2 id="mtitle">Registration Successful</h2><p id="mtext"></p><button class="save" style="width:100%" onclick="location.href='patient-health-book.html'">OPEN HEALTH BOOK</button></div></div>

<script>
const DEFAULT={clinicName:"HOMEOPLUSS Homeopathy",tagline:"Homeopathy – Caring Naturally Since 1796",welcomeHP:{enabled:true,points:2000}};
function settings(){let s=JSON.parse(localStorage.getItem("HPKYC_SETTINGS")||"null");if(!s){s=DEFAULT;localStorage.setItem("HPKYC_SETTINGS",JSON.stringify(s))}return s}
function patients(){return JSON.parse(localStorage.getItem("HPKYC_PATIENTS")||"[]")}
function save(p){localStorage.setItem("HPKYC_PATIENTS",JSON.stringify(p))}
function calcAge(){if(!dob.value){age.value="";return}let d=new Date(dob.value),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;age.value=a>=0?a:""}
dob.addEventListener("change",()=>{calcAge();if(dob.value&&mobile.value.length===10)regNo.value=`HP-${mobile.value}-${dob.value.slice(0,4)}`})
mobile.addEventListener("input",()=>{mobile.value=mobile.value.replace(/\D/g,"");if(dob.value&&mobile.value.length===10)regNo.value=`HP-${mobile.value}-${dob.value.slice(0,4)}`})
function registerPatient(){
 if(!name.value.trim()||!gender.value||!dob.value||!/^\d{10}$/.test(mobile.value)||!address.value.trim()){alert("Please complete all required fields.");return}
 const ps=patients(),rn=`HP-${mobile.value}-${dob.value.slice(0,4)}`;
 if(ps.some(p=>p.regNo===rn||String(p.mobile)===mobile.value&&String(p.dob).slice(0,4)===dob.value.slice(0,4))){alert("This patient is already registered.");return}
 let ref=referralId.value.trim(),referrer=null;
 if(ref){
   referrer=ps.find(p=>p.regNo===ref);
   if(!referrer){alert("PATIENT NOT FOUND\nPlease enter the correct Referral ID.");return}
 }
 const s=settings(), welcome=s.welcomeHP?.enabled?Number(s.welcomeHP.points)||0:0, now=new Date().toISOString();
 const p={
  id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),
  name:name.value.trim(),gender:gender.value,dob:dob.value,age:Number(age.value)||0,mobile:mobile.value,address:address.value.trim(),source:source.value,referralId:ref,regNo:rn,
  welcomeHP:welcome,earnedHP:0,visits:{checkup:[],sos:[],followup:[]},ledger:welcome?[{type:"WELCOME",label:"Welcome Health Points",points:welcome,date:now}]:[],
  referral:{status:ref?"PENDING":"NONE",referredBy:ref,completedAt:null},notes:[],prescriptions:[],appointments:[],bills:[],reports:[],communicationHistory:[]
 };
 ps.push(p);save(ps);localStorage.setItem("HPKYC_CURRENT_PATIENT",p.id);
 mtext.innerHTML=`<b>${p.name}</b><br><br>Permanent Registration No.<br><strong>${p.regNo}</strong><br><br>Welcome HP: <strong>${welcome}</strong>`;
 document.getElementById("modal").classList.add("show");
}
</script>
</body>
</html>
