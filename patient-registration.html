<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HOMEOPLUSS — Patient Registration</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f5fdff,#eef9ff,#fff);
color:#123;
display:flex;
align-items:center;
justify-content:center;
}

.app{
width:min(1100px,96vw);
height:min(720px,94vh);
background:#fff;
border:2px solid #d8f1f5;
border-radius:30px;
box-shadow:0 25px 70px rgba(0,100,150,.18);
overflow:hidden;
}

header{
height:80px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 32px;
border-bottom:1px solid #dceff3;
}

.brand{
font-size:28px;
font-weight:900;
color:#078da3;
letter-spacing:2px;
}

.title{
font-weight:900;
color:#135e78;
}

.content{
height:calc(100% - 80px);
padding:28px;
overflow:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}

.patientid{
padding:10px 16px;
border-radius:12px;
background:#eefaff;
font-weight:900;
color:#08738c;
}

.form{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.field label{
display:block;
font-size:13px;
font-weight:900;
margin-bottom:7px;
}

input,select,textarea{
width:100%;
border:2px solid #d8edf1;
border-radius:13px;
padding:13px;
font-size:16px;
outline:none;
background:#fff;
}

textarea{
height:85px;
resize:none;
}

input:focus,select:focus,textarea:focus{
border-color:#08a6ba;
}

.full{
grid-column:1/-1;
}

.actions{
display:flex;
justify-content:flex-end;
gap:15px;
margin-top:25px;
}

button{
border:0;
border-radius:14px;
padding:15px 25px;
font-weight:900;
cursor:pointer;
}

.save{
background:linear-gradient(135deg,#00a894,#087dc7);
color:#fff;
box-shadow:0 10px 25px rgba(0,130,170,.22);
}

.back{
background:#eef6f8;
color:#256;
}

.success{
display:none;
position:fixed;
inset:0;
background:rgba(255,255,255,.96);
align-items:center;
justify-content:center;
z-index:10;
}

.success.show{display:flex}

.box{
width:min(500px,90%);
padding:40px;
text-align:center;
background:#fff;
border-radius:30px;
box-shadow:0 25px 70px rgba(0,100,150,.2);
}

.tick{
width:80px;
height:80px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#00a68d,#087ac8);
color:#fff;
font-size:45px;
display:flex;
align-items:center;
justify-content:center;
}

.box h2{
color:#087d8f;
}

.next{
width:100%;
background:linear-gradient(135deg,#00a894,#087dc7);
color:#fff;
margin-top:15px;
}

@media(max-width:700px){
.app{height:96vh}
.form{grid-template-columns:1fr}
.full{grid-column:auto}
header{padding:0 18px}
.brand{font-size:21px}
.title{font-size:12px}
.content{padding:20px}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="brand">HOMEOPLUSS</div>
<div class="title">PATIENT REGISTRATION</div>
</header>

<div class="content">

<div class="top">
<h2>Complete Your Registration</h2>
<div class="patientid" id="patientId">Loading...</div>
</div>

<div class="form">

<div class="field">
<label>Patient Name *</label>
<input id="name" type="text" placeholder="Enter full name">
</div>

<div class="field">
<label>Gender *</label>
<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Date of Birth *</label>
<input id="dob" type="date" onchange="calculateAge()">
</div>

<div class="field">
<label>Age</label>
<input id="age" readonly placeholder="Auto calculated">
</div>

<div class="field full">
<label>Address *</label>
<textarea id="address" placeholder="Enter complete address"></textarea>
</div>

<div class="field">
<label>Registration Source</label>
<select id="source" onchange="toggleReferral()">
<option>Online</option>
<option>Walk-in</option>
<option>Reference</option>
</select>
</div>

<div class="field" id="refField" style="display:none">
<label>Referrer Name / Patient ID</label>
<input id="referrer" placeholder="Enter referrer">
</div>

<div class="field">
<label>BPL Card</label>
<select id="bpl">
<option value="no">No</option>
<option value="yes">Yes</option>
</select>
</div>

<div class="field">
<label>Health Insurance</label>
<select id="insurance">
<option value="no">No</option>
<option value="yes">Yes</option>
</select>
</div>

</div>

<div class="actions">
<button class="back" onclick="goBack()">← BACK</button>
<button class="save" onclick="saveRegistration()">
✓ SAVE REGISTRATION
</button>
</div>

</div>
</div>

<div class="success" id="success">
<div class="box">

<div class="tick">✓</div>

<h2>REGISTRATION COMPLETED</h2>

<p id="successText"></p>

<button class="next" onclick="openHealthBook()">
📖 VIEW MY PATIENT HEALTHBOOK
</button>

</div>
</div>

<script>

let patient=JSON.parse(
localStorage.getItem("HOMEOPLUSS_PATIENT") || "null"
);

if(!patient){
alert("Patient account not found. Returning to login.");
window.location.href="index.html";
}

document.getElementById("patientId").textContent=
patient.patientId;

function calculateAge(){

const dob=document.getElementById("dob").value;

if(!dob)return;

const birth=new Date(dob);
const today=new Date();

let age=today.getFullYear()-birth.getFullYear();

const month=today.getMonth()-birth.getMonth();

if(
month<0 ||
(month===0 && today.getDate()<birth.getDate())
){
age--;
}

document.getElementById("age").value=Math.max(0,age);
}

function toggleReferral(){

const source=document.getElementById("source").value;

document.getElementById("refField").style.display=
source==="Reference" ? "block" : "none";
}

function saveRegistration(){

const name=document.getElementById("name").value.trim();
const gender=document.getElementById("gender").value;
const dob=document.getElementById("dob").value;
const address=document.getElementById("address").value.trim();

if(!name){
alert("Please enter patient name.");
return;
}

if(!gender){
alert("Please select gender.");
return;
}

if(!dob){
alert("Please select date of birth.");
return;
}

if(!address){
alert("Please enter address.");
return;
}

patient.name=name;
patient.gender=gender;
patient.dob=dob;
patient.age=document.getElementById("age").value;
patient.address=address;
patient.source=document.getElementById("source").value;
patient.referrer=document.getElementById("referrer").value.trim();
patient.bpl=document.getElementById("bpl").value;
patient.insurance=document.getElementById("insurance").value;

if(!patient.registrationDate){
patient.registrationDate=patient.registeredAt || new Date().toISOString();
}

/*
6 month validity
*/
const regDate=new Date(patient.registrationDate);
const endDate=new Date(regDate);
endDate.setMonth(endDate.getMonth()+6);

patient.validityEnd=endDate.toISOString();

patient.registrationCompleted=true;

localStorage.setItem(
"HOMEOPLUSS_PATIENT",
JSON.stringify(patient)
);

document.getElementById("successText").innerHTML=
"Welcome <b>"+escapeHtml(name)+"</b><br><br>"+
"Patient ID: <b>"+escapeHtml(patient.patientId)+"</b><br>"+
"Your 6-month HOMEOPLUSS validity has been activated.";

document.getElementById("success").classList.add("show");
}

function openHealthBook(){
window.location.href="patient-healthbook.html";
}

function goBack(){
window.location.href="index.html";
}

function escapeHtml(text){
return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

</script>

</body>
</html>
