<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOMEOPLUSS • Health Book</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#173c55;background:linear-gradient(135deg,#f7fdfe,#eaf8fb)}
.page{height:100vh;padding:15px;display:flex;flex-direction:column;gap:12px}.top{height:70px;flex:0 0 70px;background:#fff;border:1px solid #d7edf2;border-radius:20px;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px #025da30e}.brand{font-size:22px;font-weight:900;color:#025da3}.sub{font-size:11px;color:#789}.actions{display:flex;gap:8px}.actions button{padding:10px 13px;border:0;border-radius:11px;font-weight:900}.admin{background:#eaf7f8;color:#025da3}.logout{background:#edf1f3;color:#456}
.content{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:12px}.panel{background:#fff;border:1px solid #d7edf2;border-radius:22px;padding:18px;min-height:0;overflow:auto;box-shadow:0 12px 35px #025da30d}.profile{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.info{padding:13px;border-radius:14px;background:#f4fbfc}.info small{display:block;color:#79909e}.info b{color:#025da3;font-size:14px}.hpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.hp{padding:16px;border-radius:16px;background:linear-gradient(145deg,#f2fbf8,#fff);border:1px solid #d9eee7}.hp b{font-size:25px;color:#078c69;display:block}.sectionTitle{font-size:13px;font-weight:900;color:#025da3;letter-spacing:.7px;margin:18px 0 9px}.scheme{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #edf2f4;font-size:12px}.ledger{padding:10px;border-radius:12px;background:#f8fcfd;margin-bottom:7px;font-size:12px}.green{color:#078c69;font-weight:900}.red{color:#c64a4a;font-weight:900}.appointment{padding:12px;border-radius:13px;background:#eef9fb;margin-bottom:8px}.comm{padding:11px;border-radius:13px;background:#f9f5ff;margin-bottom:7px;font-size:12px}@media(max-width:750px){.content{grid-template-columns:1fr}.panel:nth-child(2){display:none}.hpgrid{grid-template-columns:1fr 1fr}.top{height:62px;flex-basis:62px}.brand{font-size:17px}}
</style>
</head>
<body>
<div class="page">
<header class="top"><div><div class="brand" id="clinic">HOMEOPLUSS Homeopathy</div><div class="sub">PATIENT HEALTH BOOK • PRIVATE DIGITAL RECORD</div></div><div class="actions"><button class="admin" onclick="location.href='patient-admin.html'">ADMIN</button><button class="logout" onclick="logout()">LOGOUT</button></div></header>
<div class="content">
<section class="panel"><div class="sectionTitle">PATIENT PROFILE</div><div id="profile" class="profile"></div><div class="hpgrid" id="hpgrid"></div><div class="sectionTitle">CURRENT ADMIN-CONTROLLED BENEFITS</div><div id="schemes"></div></section>
<section class="panel"><div class="sectionTitle">APPOINTMENTS</div><div id="appointments"></div><div class="sectionTitle">HEALTH POINT LEDGER</div><div id="ledger"></div><div class="sectionTitle">COMMUNICATION HISTORY</div><div id="comm"></div></section>
</div>
</div>
<script>
const D={clinicName:"HOMEOPLUSS Homeopathy",earnedCap:500,schemes:{checkup:{enabled:true,points:10,dailyLimit:1},sos:{enabled:true,points:20,monthlyLimit:4},followup:{enabled:true,points:50},referralReferred:{enabled:false,points:100},referralReferrer:{enabled:false,points:50},female:{enabled:false,points:100},discount:{enabled:false,value:0,type:"percent"},specialOffer:{enabled:false,value:""}}};
function s(){let x=JSON.parse(localStorage.getItem("HPKYC_SETTINGS")||"null");if(!x){x=D;localStorage.setItem("HPKYC_SETTINGS",JSON.stringify(x))}x.schemes=Object.assign(D.schemes,x.schemes||{});return x}
function ps(){return JSON.parse(localStorage.getItem("HPKYC_PATIENTS")||"[]")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
let p=ps().find(x=>x.id===localStorage.getItem("HPKYC_CURRENT_PATIENT"));
if(!p){alert("Patient session not found.");location.href="index.html"}
function render(){
 const x=s();clinic.textContent=x.clinicName||D.clinicName;
 profile.innerHTML=`<div class="info"><small>NAME</small><b>${esc(p.name)}</b></div><div class="info"><small>REGISTRATION</small><b>${esc(p.regNo)}</b></div><div class="info"><small>MOBILE</small><b>${esc(p.mobile)}</b></div><div class="info"><small>AGE / GENDER</small><b>${p.age} / ${esc(p.gender)}</b></div><div class="info"><small>REFERRAL</small><b>${esc(p.referral?.status||"NONE")}</b></div><div class="info"><small>VISITS</small><b>${Object.values(p.visits||{}).reduce((a,b)=>a+b.length,0)}</b></div>`;
 const welcome=Number(p.welcomeHP)||0,earned=Number(p.earnedHP)||0,cap=Number(x.earnedCap)||0;
 hpgrid.innerHTML=`<div class="hp"><small>WELCOME HP</small><b>${welcome}</b></div><div class="hp"><small>EARNED HP</small><b>${earned}</b></div><div class="hp"><small>TOTAL HP</small><b>${welcome+earned}</b><small>Earned remaining: ${Math.max(0,cap-earned)}</small></div>`;
 const q=x.schemes;
 schemes.innerHTML=[
 ["Check-up",q.checkup,`+${q.checkup.points} HP • ${q.checkup.dailyLimit||0}/day`],
 ["SOS",q.sos,`+${q.sos.points} HP • ${q.sos.monthlyLimit||0}/month`],
 ["Follow-up",q.followup,`+${q.followup.points} HP`],
 ["Referral – referred patient",q.referralReferred,`+${q.referralReferred.points} HP`],
 ["Referral – referring patient",q.referralReferrer,`+${q.referralReferrer.points} HP`],
 ["Female benefit",q.female,`+${q.female.points} HP`],
 ["Discount",q.discount,`${q.discount.value||0}${q.discount.type==="percent"?"%":" ₹"} discount`],
 ["Special Offer",q.specialOffer,esc(q.specialOffer.value||"Configured by Admin")]
 ].map(a=>`<div class="scheme"><span>${a[0]}</span><b class="${a[1]?.enabled?'green':'red'}">${a[1]?.enabled?'ACTIVE':'OFF'} • ${a[2]}</b></div>`).join("");
 appointments.innerHTML=(p.appointments||[]).length?(p.appointments||[]).slice().reverse().map(a=>`<div class="appointment"><b>📅 ${esc(a.date)} ${esc(a.time)}</b><br><small>${esc(a.status||"Scheduled")}</small></div>`).join(""):`<div class="ledger">No appointments recorded.</div>`;
 ledger.innerHTML=(p.ledger||[]).slice().reverse().map(l=>`<div class="ledger"><b>${esc(l.label||l.type)}</b> <span class="${Number(l.points)>=0?'green':'red'}">${Number(l.points)>=0?'+':''}${l.points} HP</span><br><small>${new Date(l.date).toLocaleString()}</small>${l.reason?`<br>${esc(l.reason)}`:""}</div>`).join("")||"<div class='ledger'>No HP transactions yet.</div>";
 comm.innerHTML=(p.communicationHistory||[]).slice().reverse().map(c=>`<div class="comm"><b>${esc(c.type)}</b><br><small>${new Date(c.date).toLocaleString()} • ${esc(c.status||"Prepared")}</small></div>`).join("")||"<div class='ledger'>No communication history.</div>";
}
function logout(){localStorage.removeItem("HPKYC_CURRENT_PATIENT");location.href="index.html"}render();
</script>
</body>
</html>
